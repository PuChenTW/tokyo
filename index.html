.day-label{font-size:11px;font-weight:700;color:#0d9488;text-transform:uppercase}
.day-date{font-size:12px;font-weight:600;color:#475569}
.day-title{font-size:13px;font-weight:600;color:#1e293b;line-height:1.4}
.day-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chevron{font-size:16px;color:#94a3b8;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.done-icon{color:#0d9488;font-size:16px}

.day-body{border-top:1px solid #f1f5f9;display:none}
.day-body.open{display:block}

.weather-box{margin:14px 16px 8px;background:linear-gradient(135deg,#f0fdfa,#f8fafc);border:1px solid #ccfbf1;border-radius:12px;padding:14px}
.weather-label{font-size:10px;font-weight:700;color:#0d9488;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.weather-temp{font-size:22px;font-weight:700;color:#1e293b;line-height:1.2}
.weather-desc{font-size:12px;color:#64748b;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:500;background:#f0fdfa;color:#0d9488;border:1px solid #99f6e4}
.outfit-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#0d9488;background:none;border:none;cursor:pointer;margin-top:10px;padding:0}
.outfit-btn:hover{color:#0f766e}
.outfit-list{margin-top:8px;display:none}
.outfit-list.open{display:block}
.outfit-list li{display:flex;gap:8px;font-size:12px;color:#475569;margin-bottom:6px;list-style:none}
.outfit-list li::before{content:"•";color:#5eead4;flex-shrink:0;margin-top:1px}

.timeline{padding:14px 16px 8px}
.task-row{display:flex;gap:10px;position:relative;margin-bottom:0}
.task-content{flex:1;padding-bottom:14px}
.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.task-time{font-family:monospace;font-size:11px;color:#94a3b8;width:110px;flex-shrink:0}
.task-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.task-name{font-size:13px;font-weight:600;color:#1e293b}
.task-notes{margin-left:116px;background:#f8fafc;border-radius:8px;padding:8px 12px;margin-top:4px}
.task-notes li{display:flex;gap:6px;font-size:12px;color:#475569;margin-bottom:4px;list-style:none}
.task-notes li:last-child{margin-bottom:0}
.task-notes li::before{content:"–";color:#cbd5e1;flex-shrink:0}
.place-link{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:#0d9488;text-decoration:underline;text-decoration-color:#99f6e4;text-underline-offset:2px}
.place-link:hover{color:#0f766e}
.place-sub{font-weight:400;color:#64748b}

.ic-flight{background:#eff6ff;color:#3b82f6}
.ic-drive{background:#ecfdf5;color:#059669}
.ic-hotel{background:#eef2ff;color:#6366f1}
.ic-food{background:#fff7ed;color:#f97316}
.ic-sightseeing{background:#fff1f2;color:#f43f5e}
.ic-shopping{background:#faf5ff;color:#a855f7}
.ic-cafe{background:#fffbeb;color:#92400e}
.ic-train{background:#ecfeff;color:#0891b2}
.ic-nature{background:#f0fdf4;color:#16a34a}

.extra-item{display:flex;flex-direction:column;gap:3px;padding:10px;background:#fff;border-radius:10px;border:1px solid #fde68a;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.extra-item:hover{border-color:#fbbf24;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.extra-name{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#1e293b}
.extra-hours{font-size:11px;color:#b45309;font-family:monospace}
.extra-desc{font-size:11px;color:#64748b}

.nav-link--purple{color:#a855f7;border-color:#e9d5ff;background:#faf5ff}

window.__itineraryDays = days;

const ICONS = {
  flight:"✈️", drive:"🚗", hotel:"🛏️", food:"🍽️",
  sightseeing:"📷", shopping:"🛍️", cafe:"☕", train:"🚆",
  nature:"🌲", sunset:"🌅"
};

function renderDays(){
  const _days = JSON.parse(localStorage.getItem('tokyo-itinerary') || 'null') || days;
  const main = document.getElementById('main');
  main.innerHTML = '';
  _days.forEach(day => {
    const card = document.createElement('div');
    card.className = 'day-card';
    card.id = `day-${day.id}`;

    // Extra HTML
    let extraHTML = '';
    if(day.extra){
      const items = day.extra.items.map(s=>`
        <a class="extra-item" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.query)}" target="_blank" rel="noreferrer">
          <span class="extra-name">📍${s.name}</span>
          <span class="extra-hours">${s.hours}</span>
          <span class="extra-desc">${s.desc}</span>
        </a>`).join('');
      extraHTML = `
        <div class="extra-section">
          <button class="extra-btn" onclick="toggleExtra(${day.id})">
            <span>📍${day.extra.label}（${day.extra.items.length} 個選點）</span>
            <span id="extra-chev-${day.id}">▼</span>
          </button>
          <div class="extra-grid" id="extra-grid-${day.id}">${items}</div>
        </div>`;
    }

    // Tasks
    const tasksHTML = day.tasks.map((t,i)=>{
      const isLast = i===day.tasks.length-1;
      const notes = t.notes.map(n=>`<li>${n}</li>`).join('');
      return `
        <div class="task-row" id="row-${t.id}">
          <div class="task-content" id="tc-${t.id}">
            <div class="task-meta">
              <span class="task-time">${t.time}</span>
              <span class="task-icon ic-${t.ic}">${ICONS[t.ic]||'•'}</span>
              <span class="task-name">${t.name}</span>
            </div>
            ${notes?`<ul class="task-notes">${notes}</ul>`:''}
          </div>
        </div>`;
    }).join('');

    // Outfit
    const outfitItems = day.outfit.map(o=>`<li>${o}</li>`).join('');

    card.innerHTML = `
      <button class="day-header" onclick="toggleDay(${day.id})">
        <div class="day-left">
          <div class="day-label-block" id="dlb-${day.id}">
            <div class="day-label">${day.label}</div>
            <div class="day-date">${day.date}</div>
          </div>
          <div>
            <div class="day-title" id="dt-${day.id}">${day.title}</div>
          </div>
        </div>
        <div class="day-right">
          <span class="chevron" id="chev-${day.id}">▼</span>
        </div>
      </button>
      <div class="day-body" id="body-${day.id}">
        <div class="weather-box">
          <div class="weather-label">預估天氣</div>
          <div class="weather-temp">${day.temp}</div>
          <div class="weather-desc">${day.desc}</div>
          <div class="tags">${day.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          <button class="outfit-btn" onclick="toggleOutfit(${day.id})">👕 穿著建議 <span id="oc-${day.id}">▼</span></button>
          <ul class="outfit-list" id="ol-${day.id}">${outfitItems}</ul>
        </div>
        <div class="timeline">${tasksHTML}</div>
        ${extraHTML}
      </div>`;
    main.appendChild(card);
  });

  // Open day 1 by default
  document.getElementById(`body-1`).classList.add('open');
  document.getElementById(`chev-1`).classList.add('open');
}

function toggleDay(id){
  const body = document.getElementById(`body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function toggleOutfit(id){
  const ol = document.getElementById(`ol-${id}`);
  const oc = document.getElementById(`oc-${id}`);
  ol.classList.toggle('open');
  oc.textContent = ol.classList.contains('open') ? '▲' : '▼';
}

function toggleExtra(id){
  const g = document.getElementById(`extra-grid-${id}`);
  const c = document.getElementById(`extra-chev-${id}`);
  g.classList.toggle('open');
  c.textContent = g.classList.contains('open') ? '▲' : '▼';
}

// Footer
document.addEventListener('DOMContentLoaded', ()=>{
  renderDays();
  initDataControls();
  const footer = document.createElement('p');
  footer.className='footer';
  footer.textContent='所有 Google Maps 連結點擊後在新分頁開啟。各店實際營業時間建議出發前再次確認。';
  document.getElementById('main').appendChild(footer);
});

</script>
