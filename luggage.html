<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行李清單</title>
<link rel="stylesheet" href="style.css">
<style>
.cat-證件{background:#eff6ff;color:#3b82f6;border:1px solid #bfdbfe}
.cat-衣物{background:#faf5ff;color:#a855f7;border:1px solid #e9d5ff}
.cat-3C{background:#f0fdfa;color:#0d9488;border:1px solid #99f6e4}
.cat-藥品{background:#fff1f2;color:#f43f5e;border:1px solid #fecdd3}
.cat-盥洗{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.cat-其他{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}

[data-dark] .cat-證件{background:#1e3a5f;color:#60a5fa;border-color:#1d4ed8}
[data-dark] .cat-衣物{background:#2e1065;color:#c084fc;border-color:#7c3aed}
[data-dark] .cat-3C{background:#134e4a;color:#2dd4bf;border-color:#0d9488}
[data-dark] .cat-藥品{background:#4c0519;color:#fb7185;border-color:#be123c}
[data-dark] .cat-盥洗{background:#14532d;color:#4ade80;border-color:#15803d}
[data-dark] .cat-其他{background:#1e293b;color:#94a3b8;border-color:#334155}
</style>
</head>
<body>

<header>
  <div class="hinner">
    <div>
      <div class="htitle">🧳 行李清單</div>
      <div class="hsub">東京・茨城旅程</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <a href="index.html" class="back-btn">← 回行程</a>
      <button class="nm-btn" id="nm-btn" onclick="toggleNight()" title="切換深色模式">🌙</button>
    </div>
  </div>
</header>

<main>
  <div class="add-card">
    <div class="add-row">
      <input class="add-input" id="add-input" type="text" placeholder="新增行李項目…" maxlength="80" autocomplete="off">
      <select class="add-cat" id="add-cat">
        <option value="證件">證件</option>
        <option value="衣物">衣物</option>
        <option value="3C">3C</option>
        <option value="藥品">藥品</option>
        <option value="盥洗">盥洗</option>
        <option value="其他">其他</option>
      </select>
      <button class="add-btn" id="add-btn">＋ 加入</button>
    </div>
  </div>

  <div class="list-card">
    <div class="card-header">
      <div class="card-title">🧳 待備清單</div>
      <button class="clear-btn" id="clear-btn" title="刪除所有已備妥項目">清除已備</button>
      <div class="prog-wrap">
        <div class="prog-label">已備妥</div>
        <div class="prog-val" id="prog-text">0 / 0</div>
      </div>
    </div>
    <div class="item-list" id="list"></div>
  </div>
  <p class="footer">點擊圓圈標記已備妥；點擊 ✏️ 可同時修改名稱與分類</p>
</main>

<script src="app.js"></script>
<script>
initChecklist({
  dbName: 'tokyo-luggage',
  categories: ['證件','衣物','3C','藥品','盥洗','其他'],
  clearLabel: '備妥',
  defaults: [
    {name:'護照',category:'證件'},
    {name:'駕照日文譯本（或國際駕照）',category:'證件'},
    {name:'信用卡（Visa / MasterCard）',category:'證件'},
    {name:'日幣現金',category:'證件'},
    {name:'旅遊保險文件',category:'證件'},
    {name:'電子機票確認單',category:'證件'},
    {name:'短袖上衣 ×4',category:'衣物'},
    {name:'薄外套 / 罩衫',category:'衣物'},
    {name:'長褲 ×2',category:'衣物'},
    {name:'輕便摺疊傘',category:'衣物'},
    {name:'內衣褲 ×6',category:'衣物'},
    {name:'舒適步行鞋',category:'衣物'},
    {name:'夾腳拖 / 室內拖',category:'衣物'},
    {name:'睡衣',category:'衣物'},
    {name:'手機充電器',category:'3C'},
    {name:'行動電源',category:'3C'},
    {name:'轉接插頭（日本A型兩孔扁插）',category:'3C'},
    {name:'相機＋記憶卡',category:'3C'},
    {name:'耳機',category:'3C'},
    {name:'個人常備藥',category:'藥品'},
    {name:'感冒藥',category:'藥品'},
    {name:'胃腸藥',category:'藥品'},
    {name:'止痛藥',category:'藥品'},
    {name:'OK繃',category:'藥品'},
    {name:'暈車藥',category:'藥品'},
    {name:'牙刷牙膏',category:'盥洗'},
    {name:'洗髮精＋潤髮乳',category:'盥洗'},
    {name:'沐浴乳',category:'盥洗'},
    {name:'刮鬍刀',category:'盥洗'},
    {name:'基礎保養品',category:'盥洗'},
    {name:'防曬乳 SPF50+',category:'盥洗'},
    {name:'面膜',category:'盥洗'},
    {name:'行李箱鎖',category:'其他'},
    {name:'環保購物袋',category:'其他'},
    {name:'旅行頸枕',category:'其他'},
    {name:'濕紙巾',category:'其他'},
  ],
});
</script>
</body>
</html>
