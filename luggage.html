<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行李清單</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#1e293b;padding-bottom:60px}
a{color:inherit;text-decoration:none}

header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hinner{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.htitle{font-size:17px;font-weight:700;color:#0f172a}
.hsub{font-size:11px;color:#94a3b8;margin-top:2px}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#0d9488;padding:6px 12px;border-radius:8px;border:1px solid #99f6e4;background:#f0fdfa;transition:background .15s}
.back-btn:hover{background:#ccfbf1}

main{max-width:640px;margin:0 auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}

.add-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.add-row{display:flex;gap:8px;align-items:stretch}
.add-input{flex:1;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;color:#1e293b;outline:none;transition:border-color .15s;min-width:0}
.add-input:focus{border-color:#0d9488;box-shadow:0 0 0 2px rgba(13,148,136,.12)}
.add-input::placeholder{color:#94a3b8}
.add-cat{padding:10px 8px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;color:#1e293b;background:#fff;outline:none;cursor:pointer;flex-shrink:0;transition:border-color .15s}
.add-cat:focus{border-color:#0d9488}
.add-btn{padding:10px 16px;background:#0d9488;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;white-space:nowrap;flex-shrink:0}
.add-btn:hover{background:#0f766e}
.add-btn:active{background:#115e59}

.list-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-header{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-size:15px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:6px}
.clear-btn{font-size:12px;color:#94a3b8;background:none;border:1px solid #e2e8f0;border-radius:6px;padding:4px 9px;cursor:pointer;transition:color .15s,border-color .15s}
.clear-btn:hover{color:#f43f5e;border-color:#fecdd3}
.prog-wrap{text-align:right;flex-shrink:0}
.prog-label{font-size:11px;color:#94a3b8}
.prog-val{font-size:13px;font-weight:700;color:#0d9488}

.item-list{padding:4px 0}
.empty-msg{padding:28px 16px;text-align:center;font-size:13px;color:#94a3b8}

.item-row{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-bottom:1px solid #f8fafc;transition:background .1s}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:#fafcff}

.check-btn{flex-shrink:0;background:none;border:none;cursor:pointer;padding:0;line-height:0}
.check-circle{width:24px;height:24px;border-radius:50%;border:2px solid #e2e8f0;display:flex;align-items:center;justify-content:center;background:#fff;transition:border-color .15s,background .15s}
.check-circle:hover{border-color:#cbd5e1}
.check-circle.checked{border-color:#0d9488;background:#0d9488}
.check-circle.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700}

.cat-badge{flex-shrink:0;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.cat-證件{background:#eff6ff;color:#3b82f6;border:1px solid #bfdbfe}
.cat-衣物{background:#faf5ff;color:#a855f7;border:1px solid #e9d5ff}
.cat-3C{background:#f0fdfa;color:#0d9488;border:1px solid #99f6e4}
.cat-藥品{background:#fff1f2;color:#f43f5e;border:1px solid #fecdd3}
.cat-盥洗{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.cat-其他{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}

.item-name{flex:1;font-size:14px;font-weight:500;color:#1e293b;min-width:0;word-break:break-all;line-height:1.4}
.item-name.done{opacity:.35;text-decoration:line-through;text-decoration-color:#cbd5e1}
.item-edit-input{flex:1;padding:4px 8px;border:1px solid #0d9488;border-radius:6px;font-size:14px;color:#1e293b;outline:none;background:#f0fdfa;min-width:0}
.item-edit-cat{padding:4px 6px;border:1px solid #0d9488;border-radius:6px;font-size:12px;color:#1e293b;background:#f0fdfa;outline:none;flex-shrink:0}

.row-actions{display:flex;gap:2px;flex-shrink:0}
.action-btn{background:none;border:none;cursor:pointer;padding:5px 6px;border-radius:6px;font-size:14px;line-height:1;color:#94a3b8;transition:color .15s,background .15s}
.action-btn:hover{background:#f1f5f9;color:#475569}
.action-btn.del:hover{background:#fff1f2;color:#f43f5e}

.footer{font-size:11px;color:#94a3b8;text-align:center;padding:8px 0 4px}

.nm-btn{background:none;border:1px solid #e2e8f0;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:15px;line-height:1;color:#475569;transition:background .15s,border-color .15s}
.nm-btn:hover{background:#f1f5f9;border-color:#cbd5e1}

[data-dark] body{background:#0f172a;color:#e2e8f0}
[data-dark] header{background:#1e293b;border-color:#334155;box-shadow:0 1px 3px rgba(0,0,0,.3)}
[data-dark] .htitle{color:#f1f5f9}
[data-dark] .hsub{color:#475569}
[data-dark] .back-btn{color:#2dd4bf;border-color:#0d9488;background:#134e4a}
[data-dark] .back-btn:hover{background:#1a5c58}
[data-dark] .nm-btn{border-color:#334155;color:#94a3b8}
[data-dark] .nm-btn:hover{background:#263348;border-color:#475569}
[data-dark] .add-card{background:#1e293b;border-color:#334155}
[data-dark] .add-input{background:#0f172a;border-color:#334155;color:#e2e8f0}
[data-dark] .add-input:focus{border-color:#2dd4bf;box-shadow:0 0 0 2px rgba(45,212,191,.12)}
[data-dark] .add-input::placeholder{color:#475569}
[data-dark] .add-cat{background:#0f172a;border-color:#334155;color:#e2e8f0}
[data-dark] .add-cat:focus{border-color:#2dd4bf}
[data-dark] .list-card{background:#1e293b;border-color:#334155}
[data-dark] .card-header{border-color:#334155}
[data-dark] .card-title{color:#f1f5f9}
[data-dark] .clear-btn{border-color:#334155;color:#64748b}
[data-dark] .clear-btn:hover{color:#f43f5e;border-color:#fecdd3}
[data-dark] .item-row{border-color:#263348}
[data-dark] .item-row:hover{background:#263348}
[data-dark] .check-circle{border-color:#334155;background:#0f172a}
[data-dark] .check-circle:hover{border-color:#475569}
[data-dark] .item-name{color:#e2e8f0}
[data-dark] .item-edit-input{background:#0f172a;border-color:#2dd4bf;color:#e2e8f0}
[data-dark] .item-edit-cat{background:#0f172a;border-color:#2dd4bf;color:#e2e8f0}
[data-dark] .action-btn:hover{background:#263348;color:#94a3b8}
[data-dark] .action-btn.del:hover{background:#2d1a1e;color:#f43f5e}
[data-dark] .cat-證件{background:#1e3a5f;color:#60a5fa;border-color:#1d4ed8}
[data-dark] .cat-衣物{background:#2e1065;color:#c084fc;border-color:#7c3aed}
[data-dark] .cat-3C{background:#134e4a;color:#2dd4bf;border-color:#0d9488}
[data-dark] .cat-藥品{background:#4c0519;color:#fb7185;border-color:#be123c}
[data-dark] .cat-盥洗{background:#14532d;color:#4ade80;border-color:#15803d}
[data-dark] .cat-其他{background:#1e293b;color:#94a3b8;border-color:#334155}
[data-dark] .footer{color:#334155}
</style>
</head>
<body>

<header>
  <div class="hinner">
    <div>
      <div class="htitle">🧳 行李清單</div>
      <div class="hsub">東京・茨城旅程</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <a href="index.html" class="back-btn">← 回行程</a>
      <button class="nm-btn" id="nm-btn" onclick="toggleNight()" title="切換深色模式">🌙</button>
    </div>
  </div>
</header>

<main>
  <div class="add-card">
    <div class="add-row">
      <input class="add-input" id="add-input" type="text" placeholder="新增行李項目…" maxlength="80" autocomplete="off">
      <select class="add-cat" id="add-cat">
        <option value="證件">證件</option>
        <option value="衣物">衣物</option>
        <option value="3C">3C</option>
        <option value="藥品">藥品</option>
        <option value="盥洗">盥洗</option>
        <option value="其他">其他</option>
      </select>
      <button class="add-btn" id="add-btn">＋ 加入</button>
    </div>
  </div>

  <div class="list-card">
    <div class="card-header">
      <div class="card-title">🧳 待備清單</div>
      <button class="clear-btn" id="clear-btn" title="刪除所有已備妥項目">清除已備</button>
      <div class="prog-wrap">
        <div class="prog-label">已備妥</div>
        <div class="prog-val" id="prog-text">0 / 0</div>
      </div>
    </div>
    <div class="item-list" id="list"></div>
  </div>
  <p class="footer">點擊圓圈標記已備妥；點擊 ✏️ 可同時修改名稱與分類</p>
</main>

<script>
const DB_NAME = 'tokyo-luggage';
const DB_VER = 1;
const STORE_NAME = 'items';
const CATEGORIES = ['證件','衣物','3C','藥品','盥洗','其他'];
let db;

const DEFAULTS = [
  {name:'護照',category:'證件'},
  {name:'駕照日文譯本（或國際駕照）',category:'證件'},
  {name:'信用卡（Visa / MasterCard）',category:'證件'},
  {name:'日幣現金',category:'證件'},
  {name:'旅遊保險文件',category:'證件'},
  {name:'電子機票確認單',category:'證件'},
  {name:'短袖上衣 ×4',category:'衣物'},
  {name:'薄外套 / 罩衫',category:'衣物'},
  {name:'長褲 ×2',category:'衣物'},
  {name:'輕便摺疊傘',category:'衣物'},
  {name:'內衣褲 ×6',category:'衣物'},
  {name:'舒適步行鞋',category:'衣物'},
  {name:'夾腳拖 / 室內拖',category:'衣物'},
  {name:'睡衣',category:'衣物'},
  {name:'手機充電器',category:'3C'},
  {name:'行動電源',category:'3C'},
  {name:'轉接插頭（日本A型兩孔扁插）',category:'3C'},
  {name:'相機＋記憶卡',category:'3C'},
  {name:'耳機',category:'3C'},
  {name:'個人常備藥',category:'藥品'},
  {name:'感冒藥',category:'藥品'},
  {name:'胃腸藥',category:'藥品'},
  {name:'止痛藥',category:'藥品'},
  {name:'OK繃',category:'藥品'},
  {name:'暈車藥',category:'藥品'},
  {name:'牙刷牙膏',category:'盥洗'},
  {name:'洗髮精＋潤髮乳',category:'盥洗'},
  {name:'沐浴乳',category:'盥洗'},
  {name:'刮鬍刀',category:'盥洗'},
  {name:'基礎保養品',category:'盥洗'},
  {name:'防曬乳 SPF50+',category:'盥洗'},
  {name:'面膜',category:'盥洗'},
  {name:'行李箱鎖',category:'其他'},
  {name:'環保購物袋',category:'其他'},
  {name:'旅行頸枕',category:'其他'},
  {name:'濕紙巾',category:'其他'},
];

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
  });
}

function st(mode) { return db.transaction(STORE_NAME, mode).objectStore(STORE_NAME); }

function dbGetAll() {
  return new Promise((res, rej) => {
    const r = st('readonly').getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbAdd(item) {
  return new Promise((res, rej) => {
    const r = st('readwrite').add(item);
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPut(item) {
  return new Promise((res, rej) => {
    const r = st('readwrite').put(item);
    r.onsuccess = () => res();
    r.onerror = e => rej(e.target.error);
  });
}

function dbDelete(id) {
  return new Promise((res, rej) => {
    const r = st('readwrite').delete(id);
    r.onsuccess = () => res();
    r.onerror = e => rej(e.target.error);
  });
}

let items = [];

function updateProg() {
  const done = items.filter(i => i.checked).length;
  document.getElementById('prog-text').textContent = `${done} / ${items.length}`;
}

function sorted() {
  return [...items].sort((a, b) => {
    if (a.checked !== b.checked) return a.checked ? 1 : -1;
    return a.order - b.order;
  });
}

async function render() {
  items = await dbGetAll();
  const list = document.getElementById('list');
  const arr = sorted();

  if (arr.length === 0) {
    list.innerHTML = '<div class="empty-msg">還沒有項目，從上方輸入後按加入 ☝</div>';
    updateProg();
    return;
  }

  list.innerHTML = '';
  arr.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const checkBtn = document.createElement('button');
    checkBtn.className = 'check-btn';
    checkBtn.setAttribute('aria-label', `標記 ${item.name}`);
    const circle = document.createElement('div');
    circle.className = 'check-circle' + (item.checked ? ' checked' : '');
    checkBtn.appendChild(circle);
    checkBtn.addEventListener('click', () => toggleCheck(item.id));

    const badge = document.createElement('span');
    badge.className = `cat-badge cat-${item.category}`;
    badge.textContent = item.category;

    const nameEl = document.createElement('div');
    nameEl.className = 'item-name' + (item.checked ? ' done' : '');
    nameEl.textContent = item.name;

    const actions = document.createElement('div');
    actions.className = 'row-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'action-btn edit';
    editBtn.textContent = '✏️';
    editBtn.title = '編輯';
    editBtn.addEventListener('click', () => startEdit(item, row));

    const delBtn = document.createElement('button');
    delBtn.className = 'action-btn del';
    delBtn.textContent = '🗑';
    delBtn.title = '刪除';
    delBtn.addEventListener('click', () => removeItem(item.id));

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(checkBtn);
    row.appendChild(badge);
    row.appendChild(nameEl);
    row.appendChild(actions);
    list.appendChild(row);
  });

  updateProg();
}

function startEdit(item, row) {
  const badge = row.querySelector('.cat-badge');
  const nameEl = row.querySelector('.item-name');

  const catSelect = document.createElement('select');
  catSelect.className = 'item-edit-cat';
  CATEGORIES.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    if (cat === item.category) opt.selected = true;
    catSelect.appendChild(opt);
  });

  const nameInput = document.createElement('input');
  nameInput.className = 'item-edit-input';
  nameInput.type = 'text';
  nameInput.value = item.name;
  nameInput.maxLength = 80;

  badge.replaceWith(catSelect);
  nameEl.replaceWith(nameInput);
  nameInput.focus();
  nameInput.select();

  let saved = false;
  const save = async () => {
    if (saved) return;
    saved = true;
    const newName = nameInput.value.trim();
    const newCat = catSelect.value;
    if (newName && (newName !== item.name || newCat !== item.category)) {
      item.name = newName;
      item.category = newCat;
      await dbPut(item);
    }
    render();
  };

  const handleBlur = () => {
    setTimeout(() => {
      if (document.activeElement !== nameInput && document.activeElement !== catSelect) {
        save();
      }
    }, 0);
  };

  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { saved = true; render(); }
  });
  catSelect.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { saved = true; render(); }
  });
  nameInput.addEventListener('blur', handleBlur);
  catSelect.addEventListener('blur', handleBlur);
}

async function toggleCheck(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  item.checked = !item.checked;
  await dbPut(item);
  render();
}

async function removeItem(id) {
  await dbDelete(id);
  render();
}

async function addItem() {
  const input = document.getElementById('add-input');
  const catEl = document.getElementById('add-cat');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  await dbAdd({ name, category: catEl.value, checked: false, order: Date.now() });
  input.value = '';
  input.focus();
  render();
}

async function clearChecked() {
  const checked = items.filter(i => i.checked);
  if (checked.length === 0) return;
  if (!confirm(`刪除 ${checked.length} 個已備妥項目？`)) return;
  await Promise.all(checked.map(i => dbDelete(i.id)));
  render();
}

document.getElementById('add-btn').addEventListener('click', addItem);
document.getElementById('add-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});
document.getElementById('clear-btn').addEventListener('click', clearChecked);

openDB().then(async () => {
  const existing = await dbGetAll();
  if (existing.length === 0) {
    let t = Date.now();
    for (const d of DEFAULTS) {
      await dbAdd({ ...d, checked: false, order: t++ });
    }
  }
  render();
});

function toggleNight(){
  const on=document.documentElement.toggleAttribute('data-dark');
  document.getElementById('nm-btn').textContent=on?'☀️':'🌙';
  localStorage.setItem('dark',on?'1':'');
}
(()=>{if(localStorage.getItem('dark')==='1'){document.documentElement.setAttribute('data-dark','');const b=document.getElementById('nm-btn');if(b)b.textContent='☀️';}})();
</script>
</body>
</html>
