<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>購物清單</title>
<link rel="stylesheet" href="style.css">
<style>
.cat-衣物{background:#faf5ff;color:#a855f7;border:1px solid #e9d5ff}
.cat-咖啡{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.cat-藥妝{background:#fff1f2;color:#f43f5e;border:1px solid #fecdd3}
.cat-食品{background:#fff7ed;color:#f97316;border:1px solid #fed7aa}
.cat-雜貨{background:#ecfeff;color:#0891b2;border:1px solid #a5f3fc}
.cat-3C{background:#f0fdfa;color:#0d9488;border:1px solid #99f6e4}
.cat-其他{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}

[data-dark] .cat-衣物{background:#2e1065;color:#c084fc;border-color:#7c3aed}
[data-dark] .cat-咖啡{background:#451a03;color:#fbbf24;border-color:#78350f}
[data-dark] .cat-藥妝{background:#4c0519;color:#fb7185;border-color:#be123c}
[data-dark] .cat-食品{background:#431407;color:#fb923c;border-color:#9a3412}
[data-dark] .cat-雜貨{background:#164e63;color:#22d3ee;border-color:#0e7490}
[data-dark] .cat-3C{background:#134e4a;color:#2dd4bf;border-color:#0d9488}
[data-dark] .cat-其他{background:#1e293b;color:#94a3b8;border-color:#334155}
</style>
</head>
<body>

<header>
  <div class="hinner">
    <div>
      <div class="htitle">購物清單</div>
      <div class="hsub">東京・茨城旅程</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <a href="index.html" class="back-btn">← 回行程</a>
      <button class="nm-btn" id="nm-btn" onclick="toggleNight()" title="切換深色模式">🌙</button>
    </div>
  </div>
</header>

<main>
  <div class="add-card">
    <div class="add-row">
      <input class="add-input" id="add-input" type="text" placeholder="新增品項…" maxlength="80" autocomplete="off">
      <select class="add-cat" id="add-cat">
        <option value="衣物">衣物</option>
        <option value="咖啡">咖啡</option>
        <option value="藥妝">藥妝</option>
        <option value="食品">食品</option>
        <option value="雜貨">雜貨</option>
        <option value="3C">3C</option>
        <option value="其他">其他</option>
      </select>
      <button class="add-btn" id="add-btn">＋ 加入</button>
    </div>
  </div>

  <div class="list-card">
    <div class="card-header">
      <div class="card-title">🛍 待買清單</div>
      <button class="clear-btn" id="clear-btn" title="刪除所有已購入項目">清除已買</button>
      <div class="prog-wrap">
        <div class="prog-label">已購入</div>
        <div class="prog-val" id="prog-text">0 / 0</div>
      </div>
    </div>
    <div class="item-list" id="list"></div>
  </div>
  <p class="footer">點擊圓圈標記已購入</p>
</main>

<script src="app.js"></script>
<script>
initChecklist({
  dbName: 'tokyo-shopping',
  categories: ['衣物','咖啡','藥妝','食品','雜貨','3C','其他'],
  clearLabel: '購入',
});
</script>
</body>
</html>
